name: Java CI/CD with Docker

on:
  push:
    branches: ["stage"] # stage 브랜치에 푸시될 때 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Java 21 설정 (사용 중인 JDK 버전과 일치시켜야 합니다)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # 2. Gradle 빌드 (테스트는 일단 제외하고 빌드 속도를 높입니다)
      - name: Grant execute permission for gradlew
        run: chmod +x /blog/blog/gradlew

      - name: Build with Gradle
        run: ./blog/blog/gradlew build -x test -p ./blog/blog

      # 3. Docker Hub 로그인 (등록한 Secrets 사용)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./blog/blog
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/semicolon-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/semicolon-backend:${{ github.sha }}
